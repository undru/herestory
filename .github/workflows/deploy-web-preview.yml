name: Deploy web preview

# Deploy only commits on main that passed Verify app.
on:
  workflow_run:
    workflows: [Verify app]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 20.19.4
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web preview
        env:
          GITHUB_PAGES: 'true'
        run: npm run export:web

      # Expo prefixes bundles with /herestory, but not the static links in
      # public/. Pages also needs 404.html so deep links load the app.
      - name: Adapt build for GitHub Pages
        run: |
          sed -i -e 's#href="/manifest.json"#href="/herestory/manifest.json"#' \
            -e 's#href="/icons/#href="/herestory/icons/#g' dist/index.html
          sed -i -e 's#"start_url": "/"#"start_url": "/herestory/"#' \
            -e 's#"scope": "/"#"scope": "/herestory/"#' \
            -e 's#"src": "/icons/#"src": "/herestory/icons/#g' dist/manifest.json
          cp dist/index.html dist/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
